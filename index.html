<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <title>Church System | คริสตจักรสายธารพระคุณ</title>

  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Church System">

  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" href="./favicon.png">

  <style>
    :root {
      --top-safe: env(safe-area-inset-top, 0px);
      --bottom-safe: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #ffffff;
    }

    #shell {
      position: fixed;
      left: 0;
      right: 0;
      top: var(--top-safe);
      bottom: calc(-1 * var(--bottom-safe));
      background: #ffffff;
      overflow: hidden;
    }

    #appFrame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 14px;
      background: linear-gradient(180deg, #eef6ff 0%, #ffffff 70%);
      transition: opacity .2s ease, visibility .2s ease;
    }

    #loading.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #loading img {
      width: 108px;
      height: 108px;
      border-radius: 26px;
      object-fit: cover;
      background: #fff;
      box-shadow: 0 12px 34px rgba(20, 80, 160, .16);
    }

    #loading strong {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 18px;
      color: #17365f;
    }

    #loading span {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      color: #71849a;
    }
  </style>

</head>

<body>
  <div id="loading">
    <img src="./icon-512.png" alt="โลโก้คริสตจักร">
    <strong>คริสตจักรสายธารพระคุณ</strong>
    <span>กำลังเปิด Church System</span>
  </div>

  <div id="shell">
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbzxP0l52UGx5veHwyo_jGCDYppLacirhePSn2Zu5nEoFbvGf3sG8aVG_5mZ6IugPMTS/exec"
      title="Church System"
      allow="camera; microphone; clipboard-read; clipboard-write; fullscreen">
    </iframe>
  </div>

  <script>
    var loading = document.getElementById("loading");
    var frame = document.getElementById("appFrame");

    frame.addEventListener("load", function () {
      setTimeout(function () {
        loading.classList.add("hide");
      }, 200);
    });

    setTimeout(function () {
      loading.classList.add("hide");
    }, 8000);

    // ล้าง Service Worker / Cache รุ่นเก่า เพื่อไม่ให้ไฟล์เดิมกลับมาอีก
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations()
        .then(function (regs) {
          regs.forEach(function (reg) { reg.unregister(); });
        })
        .catch(function () {});
    }

    if ("caches" in window) {
      caches.keys()
        .then(function (keys) {
          return Promise.all(keys.map(function (key) { return caches.delete(key); }));
        })
        .catch(function () {});
    }
  </script>
</body>
</html>
